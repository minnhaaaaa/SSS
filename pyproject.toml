[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sss-enforcement"
version = "0.1.0"
description = "SSS enforcement, gateway, API, and demo foundations"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "rich>=13,<15",
  "structlog>=24,<26",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
sss = "sss_cli.main:app"

[tool.setuptools.packages.find]
where = ["apps/api", "apps/cli", "apps/gateway", "demo/canary"]
include = ["sss_api*", "sss_cli*", "sss_gateway*", "sss_canary*"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
consider_namespace_packages = true
markers = ["docker: requires a running local Docker engine"]
testpaths = ["tests"]
pythonpath = ["apps/api", "apps/cli", "apps/gateway", "demo/canary"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"]
"tests/e2e/**/*.py" = ["S101", "S106", "S603"]
"tests/security/test_container_configuration.py" = ["S101", "S106", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sss_api", "sss_cli", "sss_gateway", "sss_canary"]
mypy_path = ["apps/api", "apps/cli", "apps/gateway", "demo/canary"]
