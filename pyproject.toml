[project]
name = "stop-slop-squatting"
version = "0.1.0"
description = "Global package-hallucination intelligence and deterministic install policy"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28,<0.29",
  "packaging>=24.2,<26",
  "pydantic>=2.10,<3",
  "pyexasol>=0.27,<1",
  "pyyaml>=6.0.2,<7",
  "structlog>=24.4,<26",
  "tenacity>=9,<10",
]

[dependency-groups]
dev = [
  "hypothesis>=6.124,<7",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["packages/core", "apps/worker"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["packages/core", "apps/worker"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/core/sss_core", "apps/worker/sss_worker"]
