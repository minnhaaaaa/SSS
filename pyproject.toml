[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stop-slop-squatting"
version = "0.1.0"
description = "Package-hallucination intelligence and deterministic install enforcement"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<0.29",
  "packaging>=24.2,<26",
  "pydantic>=2.10,<3",
  "pyexasol>=0.27,<1",
  "pyyaml>=6.0.2,<7",
  "rich>=13,<15",
  "structlog>=24.4,<26",
  "tenacity>=9,<10",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
sss = "sss_cli.main:app"
sss-worker = "sss_worker.main:app"
sss-demo-agent = "sss_demo_agent.main:main"

[dependency-groups]
dev = [
  "duckdb>=1.4,<2",
  "hypothesis>=6.124,<7",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
  "types-pyyaml>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = [
  "packages/core/sss_core",
  "apps/worker/sss_worker",
  "apps/api/sss_api",
  "apps/cli/sss_cli",
  "apps/gateway/sss_gateway",
  "demo/canary/sss_canary",
  "demo/agent/sss_demo_agent",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
consider_namespace_packages = true
markers = ["docker: requires a running local Docker engine"]
testpaths = ["tests"]
pythonpath = [
  ".",
  "packages/core",
  "apps/worker",
  "apps/api",
  "apps/cli",
  "apps/gateway",
  "demo/canary",
  "demo/agent",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sss_core", "sss_worker", "sss_api", "sss_cli", "sss_gateway", "sss_canary", "sss_demo_agent"]
mypy_path = [
  ".",
  "packages/core",
  "apps/worker",
  "apps/api",
  "apps/cli",
  "apps/gateway",
  "demo/canary",
  "demo/agent",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106", "S603", "S607"]
"tests/e2e/**/*.py" = ["S101", "S106", "S603"]
"tests/security/test_container_configuration.py" = ["S101", "S106", "S603"]
